<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C99B"/>
      <stop offset="40%" stop-color="#E0A464"/>
      <stop offset="100%" stop-color="#B87536"/>
    </linearGradient>
    <linearGradient id="bagStrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C98A4E"/>
      <stop offset="100%" stop-color="#8A5424"/>
    </linearGradient>
    <filter id="bagShadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="112" cy="150" rx="62" ry="16" fill="#5A3413" opacity="0.22" filter="url(#bagShadowBlur)"/>

  <!-- Strap -->
  <path d="M70,70 Q100,40 130,70" fill="none" stroke="url(#bagStrapGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Bag body -->
  <rect x="45" y="70" width="110" height="80" rx="20" fill="url(#bagGrad)" stroke="#8A5424" stroke-width="2"/>

  <!-- Side pocket -->
  <rect x="60" y="95" width="34" height="40" rx="10" fill="#8A5424" opacity="0.35"/>

  <!-- Zipper line -->
  <line x1="45" y1="92" x2="155" y2="92" stroke="#8A5424" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Highlight -->
  <ellipse cx="72" cy="88" rx="18" ry="10" fill="#FFFFFF" opacity="0.5"/>
</svg>
